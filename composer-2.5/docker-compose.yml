services:
  postgres:
    image: postgres:16-alpine
    container_name: document-portal-db
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: document_portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d document_portal"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
