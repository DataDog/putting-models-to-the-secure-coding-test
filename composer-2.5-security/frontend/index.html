<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document Portal</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="header" id="header" hidden>
        <div class="header-inner">
          <a href="#/" class="logo">Document Portal</a>
          <nav class="nav">
            <a href="#/" data-nav="documents">Documents</a>
            <a href="#/profile" data-nav="profile">Profile</a>
            <a href="#/admin" data-nav="admin" id="admin-link" hidden>Admin</a>
          </nav>
          <div class="user-menu">
            <span id="user-greeting"></span>
            <button id="logout-btn" class="btn btn-ghost">Log out</button>
          </div>
        </div>
      </header>

      <main id="main" class="main"></main>

      <footer class="footer">
        <p>Document Portal &mdash; Secure file sharing and collaboration</p>
      </footer>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
